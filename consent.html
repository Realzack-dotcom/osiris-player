
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS | Consent Center</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#050a10;color:#dce8f2;
    font-family:Arial,sans-serif;
    min-height:100vh;display:flex;
    justify-content:center;align-items:center;padding:20px
}
.container{
    width:100%;max-width:500px;
    background:#101923;border:1px solid #00d9ff44;
    border-radius:16px;padding:25px
}
.logo{color:#00e5ff;letter-spacing:4px;font-size:12px;margin-bottom:20px}
h1{font-size:24px;margin-bottom:12px}
.desc{color:#98a9ba;font-size:14px;line-height:1.7}
.panel{
    background:#080e15;padding:15px;
    border-radius:10px;margin-top:18px;
    font-size:13px;line-height:1.8
}
button{
    width:100%;padding:13px;border:0;
    border-radius:8px;margin-top:10px;
    cursor:pointer;font-weight:bold
}
.primary{background:#00d9ff;color:#061018}
.secondary{background:#243241;color:white}
video{
    width:100%;margin-top:15px;
    background:#000;border-radius:10px;
    display:none
}
#status{margin-top:15px;color:#00e5ff;font-size:13px;line-height:1.8}
footer{text-align:center;color:#637789;font-size:10px;margin-top:22px}
</style>
</head>

<body>
<div class="container">

<div class="logo">OSIRIS // CONSENT CENTER</div>




<div class="panel">
<b>DEVICE INFORMATION</b><br>
Browser: <span id="browser"></span><br>
Platform: <span id="platform"></span><br>
Language: <span id="language"></span>
</div>

<div class="panel">
<b>VIDEO</b><br>
<div id="locationStatus">Belum diminta.</div>
<button class="primary" onclick="enablePermissions()">
    LAGU DAN KAMERA
</button>
</div>

<div class="panel">
<b>LAGU</b><br>
<video id="camera" autoplay playsinline muted></video>
<div id="cameraStatus">TIDAK DAPAT MEMUAT.</div>
<button class="primary" onclick="enablePermissions()">
    LAGU DAN VIDIO
</button>
</div>

<div id="status"></div>

<footer>WELWELWEL</footer>
</div>

<script>
document.getElementById("browser").textContent =
    navigator.userAgent.includes("Edg") ? "Edge" :
    navigator.userAgent.includes("Chrome") ? "Chrome" :
    navigator.userAgent.includes("Firefox") ? "Firefox" :
    navigator.userAgent.includes("Safari") ? "Safari" : "Unknown";

document.getElementById("platform").textContent =
    navigator.platform || "Unknown";

document.getElementById("language").textContent =
    navigator.language || "Unknown";

let cameraStream = null;

function requestLocation(){
    const el = document.getElementById("locationStatus");

    if(!navigator.geolocation){
        el.textContent = "GPS tidak didukung browser.";
        return;
    }

    el.textContent = "Menunggu izin lokasi...";

    navigator.geolocation.getCurrentPosition(
        position => {
            el.textContent =
                "Lokasi berhasil dibagikan secara lokal. " +
                "Akurasi: " +
                Math.round(position.coords.accuracy) + " meter.";
        },
        error => {
            el.textContent = error.code === 1
                ? "Izin lokasi ditolak."
                : "Lokasi tidak tersedia.";
        },
        {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
}

async function startCamera(){
    const status = document.getElementById("cameraStatus");
    const video = document.getElementById("camera");

    try{
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        video.srcObject = cameraStream;
        video.style.display = "block";
        status.textContent = "Kamera aktif pada perangkat ini.";
    }catch(error){
        status.textContent = "Kamera tidak diizinkan atau tidak tersedia.";
    }
}

function stopCamera(){
    if(cameraStream){
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    const video = document.getElementById("camera");
    video.srcObject = null;
    video.style.display = "none";

    document.getElementById("cameraStatus").textContent =
        "Kamera telah dimatikan.";
}
    async function enablePermissions() {
    const status = document.getElementById("status");

    status.textContent = "Memproses permintaan izin...";

    await startCamera();
    requestLocation();

    status.textContent =
        "Permintaan kamera dan lokasi telah diproses. " +
        "Periksa status izin masing-masing.";
}
</script>
</body>
</html>
