
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .player {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: #000;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="player">
    <video controls playsinline preload="metadata">
      <source src="video1.mp4" type="video/mp4">
      Browser kamu tidak mendukung video.
    </video>
  </div>
</body>
</html>
