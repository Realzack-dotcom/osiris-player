
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .player {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: #000;
      border-radius: 12px;
    }
    .navbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 5%;
    background: #070c12;
    border-bottom: 1px solid #18313c;
}

.navbar a {
    color: #8095a8;
    text-decoration: none;
    font-family: Consolas, monospace;
    font-size: 12px;
    padding: 10px 15px;
    border: 1px solid #1a303b;
    transition: .2s;
}

.navbar a:hover {
    color: #00ffd0;
    border-color: #00ffd0;
    background: #00ffd008;
}
  </style>
  <style>
/* OSIRIS CYBER UI */
body {
    background: #05080d !important;
    color: #00eaff !important;
    font-family: Consolas, monospace !important;
}

video {
    border: 1px solid rgba(0, 238, 255, 0.4) !important;
    border-radius: 12px !important;
    box-shadow: 0 0 25px rgba(0, 238, 255, 0.12) !important;
    background: #000 !important;
    max-width: 100%;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        rgba(0, 255, 255, 0.025) 1px,
        transparent 3px
    );
    z-index: 9998;
}

.cyber-status {
    color: #00ff9c;
    font-size: 11px;
    letter-spacing: 3px;
    text-align: center;
    margin: 15px 0;
}

@media (max-width: 600px) {
    video {
        width: 100% !important;
        height: auto !important;
    }
}
</style>
</head>

<body>
  <nav class="navbar">
    <a href="./control.html">⌂ CONTROL CENTER</a>
    <a href="./index.html">▶ VIDEO PLAYER</a>
    <a href="./dashboard.html">▤ ANALYTICS</a>
    <a href="./monitor.html">⌁ DIGITAL MONITOR</a>
</nav>
  <div class="player">
    <video controls playsinline preload="metadata">
      <source src="video1.mp4" type="video/mp4">
      Browser kamu tidak mendukung video.
    </video>
  </div>
  <div id="privacy-notice" style="
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  padding:12px;
  background:#111827;
  color:white;
  font-size:12px;
  text-align:center;
  border-radius:8px;
  z-index:9999;
">
  
</div>
</body>
</html>
